<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13">
  <rect width="980" height="600" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.5"/></pattern>
  </defs>
  <text x="20" y="30" font-size="17" font-weight="bold">run_g0, run_f0, run_f1은 학습 데이터만 달라요</text>
  <text x="20" y="52" fill="#555">모델, 손실, 스텝 수는 셋 다 같아요. 빗금 칸이 각 run에 들어간 파노라마 묶음이에요.</text>

  <!-- 데이터 묶음 -->
  <text x="20" y="92" font-weight="bold">파노라마 묶음</text>
  <rect x="160" y="72" width="170" height="34" fill="none" stroke="#111"/><text x="245" y="94" text-anchor="middle">기존 실내</text>
  <rect x="340" y="72" width="170" height="34" fill="none" stroke="#111"/><text x="425" y="94" text-anchor="middle">기존 야외(하늘 &gt; 20%)</text>
  <rect x="520" y="72" width="170" height="34" fill="none" stroke="#111"/><text x="605" y="94" text-anchor="middle">새 식당, 카페 실내 42</text>
  <rect x="700" y="72" width="170" height="34" fill="none" stroke="#111"/><text x="785" y="94" text-anchor="middle">새 식당, 카페 야외 57</text>

  <text x="20" y="146" font-weight="bold">run_g0</text>
  <rect x="160" y="128" width="170" height="28" fill="url(#h)" stroke="#111"/>
  <rect x="340" y="128" width="170" height="28" fill="none" stroke="#bbb"/>
  <rect x="520" y="128" width="170" height="28" fill="none" stroke="#bbb"/>
  <rect x="700" y="128" width="170" height="28" fill="none" stroke="#bbb"/>
  <text x="885" y="147">학습 306</text>

  <text x="20" y="190" font-weight="bold">run_f0</text>
  <rect x="160" y="172" width="170" height="28" fill="url(#h)" stroke="#111"/>
  <rect x="340" y="172" width="170" height="28" fill="none" stroke="#bbb"/>
  <rect x="520" y="172" width="170" height="28" fill="url(#h)" stroke="#111"/>
  <rect x="700" y="172" width="170" height="28" fill="none" stroke="#bbb"/>
  <text x="885" y="191">학습 337</text>

  <text x="20" y="234" font-weight="bold">run_f1 (시드 0, 1, 2)</text>
  <rect x="160" y="216" width="170" height="28" fill="url(#h)" stroke="#111"/>
  <rect x="340" y="216" width="170" height="28" fill="url(#h)" stroke="#111"/>
  <rect x="520" y="216" width="170" height="28" fill="url(#h)" stroke="#111"/>
  <rect x="700" y="216" width="170" height="28" fill="url(#h)" stroke="#111"/>
  <text x="885" y="235">학습 463</text>
  <text x="160" y="268" fill="#555" font-size="12">같은 건물 사진은 한 그룹으로 묶고, 그룹 단위로 학습 90%, 시험 10%로 나눠요. 같은 그룹은 서로 오답으로 쓰지 않아요.</text>

  <!-- 학습 한 스텝 -->
  <text x="20" y="318" font-size="15" font-weight="bold">학습 한 스텝 (세 run 공통)</text>
  <ellipse cx="110" cy="400" rx="85" ry="40" fill="none" stroke="#111"/><text x="110" y="396" text-anchor="middle">파노라마 1장</text><text x="110" y="414" text-anchor="middle" fill="#555" font-size="11">배치에 8장</text>
  <line x1="195" y1="400" x2="245" y2="400" stroke="#111" marker-end="url(#a)"/>
  <rect x="250" y="350" width="70" height="55" fill="none" stroke="#111"/><text x="285" y="382" text-anchor="middle">조각 A</text>
  <rect x="330" y="350" width="70" height="55" fill="none" stroke="#111"/><rect x="352" y="365" width="16" height="40" fill="#111"/><text x="385" y="420" text-anchor="middle" fill="#555" font-size="11">사람 합성</text>
  <text x="325" y="440" text-anchor="middle" fill="#555" font-size="11">방향 30~180° 차이로 잘라요</text>
  <text x="325" y="456" text-anchor="middle" fill="#555" font-size="11">70% 확률로 한쪽에 사람 합성</text>
  <line x1="405" y1="380" x2="455" y2="380" stroke="#111" marker-end="url(#a)"/>
  <rect x="460" y="345" width="200" height="70" fill="none" stroke="#111"/>
  <text x="560" y="368" text-anchor="middle">MegaLoc + LoRA</text><text x="560" y="388" text-anchor="middle" fill="#555" font-size="11">9~12번 블록 qkv, rank 8</text><text x="560" y="404" text-anchor="middle" fill="#555" font-size="11">학습 숫자 98,304개만 바뀜</text>
  <line x1="660" y1="380" x2="710" y2="380" stroke="#111" marker-end="url(#a)"/>
  <rect x="715" y="345" width="245" height="70" fill="none" stroke="#111"/>
  <text x="837" y="368" text-anchor="middle">같은 환경 점수</text><text x="837" y="388" text-anchor="middle" fill="#555" font-size="11">사람 조각을 빼고 조각끼리 chamfer</text><text x="837" y="404" text-anchor="middle" fill="#555" font-size="11">A와 B, A와 배치의 다른 7장</text>
  <line x1="837" y1="415" x2="837" y2="470" stroke="#111" marker-end="url(#a)"/>
  <rect x="640" y="475" width="320" height="70" fill="none" stroke="#111" stroke-width="2"/>
  <text x="800" y="500" text-anchor="middle">InfoNCE, 온도 0.03, kd 0</text><text x="800" y="520" text-anchor="middle" fill="#555" font-size="11">A-B 점수는 올리고 다른 파노라마 7장과의 점수는 내려요</text><text x="800" y="536" text-anchor="middle" fill="#555" font-size="11">2,000스텝, 맥미니 M4에서 run 하나 약 1시간</text>
  <text x="20" y="500" fill="#555" font-size="12">평가: 0, 500, 1000, 1500, 2000스텝마다 ETH3D(13개 장면)로</text>
  <text x="20" y="518" fill="#555" font-size="12">다른 장소 쌍 2만 개의 1%만 넘는 기준값을 정하고,</text>
  <text x="20" y="536" fill="#555" font-size="12">방향 차이 구간별로 같은 장면 쌍을 몇 % 맞히는지 봐요.</text>
  <text x="20" y="580" fill="#555" font-size="12">기존 야외 묶음의 정확한 장 수는 기록하지 않았어요. run_f1의 463장에서 run_f0의 실내 묶음과 새 사진을 빼면 대략 나와요(검증 필요).</text>
</svg>
