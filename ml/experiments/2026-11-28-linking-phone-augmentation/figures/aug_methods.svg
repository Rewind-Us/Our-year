<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13">
  <rect width="980" height="430" fill="#fff"/>
  <defs><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.5"/></pattern></defs>
  <text x="20" y="30" font-size="17" font-weight="bold">실험마다 학습 조각에 더한 휴대폰 사진 변형</text>
  <text x="20" y="52" fill="#555">아래로 갈수록 위 실험의 변형을 모두 포함해요. 데이터, 스텝(2,000), 시드(0)는 v1과 같아요. 평가 세트는 바꾸지 않았어요.</text>
  <g font-size="13">
    <text x="20" y="96" font-weight="bold">v1</text>
    <rect x="120" y="76" width="200" height="34" fill="none" stroke="#111"/><text x="220" y="98" text-anchor="middle">정사각형 자르기</text>
    <text x="340" y="98" fill="#555">화각 60~80°, 기울기 ±10°, 사람 합성 70%(화면 5~70%)</text>

    <text x="20" y="156" font-weight="bold">a1</text>
    <rect x="120" y="136" width="200" height="34" fill="url(#h)" stroke="#111"/><rect x="126" y="142" width="188" height="22" fill="#fff"/><text x="220" y="158" text-anchor="middle">세로 3:4로 자르고 누르기</text>
    <text x="340" y="158" fill="#555">80%는 세로 3:4, 20%는 가로 4:3으로 잘라 322×322로 눌러요. 실제 휴대폰 사진 입력과 같게 맞춘 것이에요.</text>

    <text x="20" y="216" font-weight="bold">a2</text>
    <rect x="120" y="196" width="200" height="34" fill="url(#h)" stroke="#111"/><rect x="126" y="202" width="188" height="22" fill="#fff"/><text x="220" y="218" text-anchor="middle">+ 조명과 화질</text>
    <text x="340" y="212" fill="#555">밝기 0.45~1.15배와 감마(대부분 어둡게), 대비 ±30%, 색온도 ±15%,</text>
    <text x="340" y="230" fill="#555">노이즈, 흐림(30%), JPEG 압축 품질 30~90(50%)</text>

    <text x="20" y="276" font-weight="bold">a3</text>
    <rect x="120" y="256" width="200" height="34" fill="url(#h)" stroke="#111"/><rect x="126" y="262" width="188" height="22" fill="#fff"/><text x="220" y="278" text-anchor="middle">+ 자세와 가림</text>
    <text x="340" y="272" fill="#555">좌우 뒤집기 50%(거울 셀카), 화각 최대 110°(40%), 기울기 최대 ±35°(40%),</text>
    <text x="340" y="290" fill="#555">사람 합성 최대 80%</text>
  </g>
  <rect x="20" y="320" width="940" height="90" fill="none" stroke="#bbb"/>
  <text x="34" y="344" font-weight="bold">일부러 넣지 않은 변형</text>
  <text x="34" y="366" fill="#555">위아래 뒤집기, 90° 회전: 사진은 방향 정보로 바로 세운 뒤 넣고, 천장과 바닥 위치가 장소 단서라서요.</text>
  <text x="34" y="386" fill="#555">색 크게 바꾸기: 벽 색, 나무 색이 장소를 가르는 단서라서요. 무작위 검은 네모: 실제 가림은 대부분 사람이라 사람 합성으로 대신했어요.</text>
</svg>
