<text x="20" y="470" fill="#555">a2: 어두운 다른 장소 점수를 낮췄지만 같은 장소 점수도 낮아져 덜 찾아요. a3: 천장 사진 쌍은 가장 많이 올랐지만 여전히 기준 아래예요.</text></svg>