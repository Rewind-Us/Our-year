<text x="20" y="30" font-size="17" font-weight="bold">실사진 60장, 같은 기준값 0.611: 하나가 좋아지면 다른 하나가 나빠졌어요</text>
<text x="20" y="52" fill="#555">기준값 효과를 빼려고 네 모델 모두 v1 기준값으로 비교했어요.</text>
<text x="20" y="80" font-weight="bold">처음 보는 22장에서 찾은 쌍 (82개 중)</text>
