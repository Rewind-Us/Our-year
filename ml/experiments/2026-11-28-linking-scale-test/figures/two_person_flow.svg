<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13">
  <rect width="980" height="470" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
  <text x="20" y="30" font-size="17" font-weight="bold">두 사람 사진 수백 장에서 같은 순간 찾기 (pipeline.py)</text>
  <text x="20" y="52" fill="#555">시간 축 위의 네모 하나가 사진 한 장이에요. 위는 나, 아래는 친구예요.</text>
  <text x="20" y="98" font-weight="bold">나</text><text x="20" y="168" font-weight="bold">친구</text>
  <line x1="70" y1="125" x2="950" y2="125" stroke="#bbb"/><text x="900" y="142" fill="#555" font-size="11">시간 →</text>
  <g fill="#555"><rect x="90" y="85" width="8" height="20"/><rect x="102" y="85" width="8" height="20"/><rect x="114" y="85" width="8" height="20"/>
  <rect x="330" y="85" width="8" height="20"/><rect x="342" y="85" width="8" height="20"/><rect x="354" y="85" width="8" height="20"/><rect x="366" y="85" width="8" height="20"/>
  <rect x="640" y="85" width="8" height="20"/><rect x="652" y="85" width="8" height="20"/></g>
  <g fill="#fff" stroke="#111"><rect x="340" y="155" width="8" height="20"/><rect x="352" y="155" width="8" height="20"/><rect x="378" y="155" width="8" height="20"/>
  <rect x="520" y="155" width="8" height="20"/><rect x="532" y="155" width="8" height="20"/><rect x="820" y="155" width="8" height="20"/></g>
  <rect x="80" y="78" width="50" height="34" fill="none" stroke="#111" stroke-dasharray="3 2"/><text x="105" y="72" text-anchor="middle" font-size="11">사건</text>
  <rect x="322" y="78" width="72" height="104" fill="none" stroke="#111" stroke-width="2"/><text x="358" y="198" text-anchor="middle" font-size="12" font-weight="bold">비교 묶음</text>
  <text x="358" y="214" text-anchor="middle" font-size="11" fill="#555">시간이 겹치는 두 사람의 사건</text>
  <rect x="632" y="78" width="36" height="34" fill="none" stroke="#111" stroke-dasharray="3 2"/>
  <rect x="512" y="148" width="36" height="34" fill="none" stroke="#111" stroke-dasharray="3 2"/>
  <text x="590" y="232" text-anchor="middle" font-size="11" fill="#555">겹치는 상대가 없는 사건은 비교하지 않아요</text>

  <text x="20" y="270" font-size="15" font-weight="bold">비교 묶음마다</text>
  <rect x="20" y="290" width="200" height="90" fill="none" stroke="#111"/><text x="120" y="318" text-anchor="middle">1. 사건 나누기</text><text x="120" y="340" text-anchor="middle" fill="#555" font-size="11">사진 간격 &gt; 120분이면 끊기</text><text x="120" y="358" text-anchor="middle" fill="#555" font-size="11">겹침 여유 앞뒤 30분</text>
  <line x1="220" y1="335" x2="250" y2="335" stroke="#111" marker-end="url(#a)"/>
  <rect x="255" y="290" width="210" height="90" fill="none" stroke="#111"/><text x="360" y="318" text-anchor="middle">2. 1차 후보</text><text x="360" y="340" text-anchor="middle" fill="#555" font-size="11">전역 벡터로 사진마다</text><text x="360" y="358" text-anchor="middle" fill="#555" font-size="11">가장 비슷한 10장만</text>
  <line x1="465" y1="335" x2="495" y2="335" stroke="#111" marker-end="url(#a)"/>
  <rect x="500" y="290" width="210" height="90" fill="none" stroke="#111"/><text x="605" y="318" text-anchor="middle">3. 정밀 비교</text><text x="605" y="340" text-anchor="middle" fill="#555" font-size="11">고른 쌍만 같은 환경 점수</text><text x="605" y="358" text-anchor="middle" fill="#555" font-size="11">(점수 계산은 밖에서 넣어 줌)</text>
  <line x1="710" y1="335" x2="740" y2="335" stroke="#111" marker-end="url(#a)"/>
  <rect x="745" y="290" width="215" height="90" fill="none" stroke="#111" stroke-width="2"/><text x="852" y="318" text-anchor="middle">4. 라우터 v1</text><text x="852" y="340" text-anchor="middle" fill="#555" font-size="11">직접 0.611, 다리 0.631로 잇고</text><text x="852" y="358" text-anchor="middle" fill="#555" font-size="11">두 사람 사진이 다 있는 묶음만</text>
  <text x="20" y="420" fill="#111">결과: 같은 순간 묶음(자동), 확인 질문 후보(나와 친구 사이), 촬영 시각이 없어 비교하지 못한 사진 목록</text>
  <text x="20" y="444" fill="#555" font-size="12">기준값과 간격은 모두 config.json에 있어요.</text>
</svg>
