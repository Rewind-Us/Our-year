<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14">
  <rect width="960" height="420" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#111">학습: 360° 파노라마 한 장으로 정답쌍 만들기</text>
  <rect x="20" y="50" width="200" height="90" fill="none" stroke="#111"/>
  <text x="120" y="88" text-anchor="middle" fill="#111">360° 파노라마</text>
  <text x="120" y="110" text-anchor="middle" fill="#555" font-size="12">Wikimedia, Poly Haven</text>
  <line x1="220" y1="95" x2="275" y2="95" stroke="#111" marker-end="url(#a)"/>
  <rect x="280" y="50" width="210" height="90" fill="none" stroke="#111"/>
  <text x="385" y="80" text-anchor="middle" fill="#111">방향이 30~180° 다른</text>
  <text x="385" y="100" text-anchor="middle" fill="#111">조각 2장 잘라내기</text>
  <text x="385" y="122" text-anchor="middle" fill="#555" font-size="12">70% 확률로 사람 합성</text>
  <line x1="490" y1="95" x2="545" y2="95" stroke="#111" marker-end="url(#a)"/>
  <rect x="550" y="50" width="180" height="90" fill="none" stroke="#111"/>
  <text x="640" y="80" text-anchor="middle" fill="#111">같은 환경 점수</text>
  <text x="640" y="100" text-anchor="middle" fill="#555" font-size="12">사람 조각 빼고</text>
  <text x="640" y="118" text-anchor="middle" fill="#555" font-size="12">조각끼리 chamfer</text>
  <line x1="730" y1="95" x2="785" y2="95" stroke="#111" marker-end="url(#a)"/>
  <rect x="790" y="50" width="150" height="90" fill="none" stroke="#111"/>
  <text x="865" y="80" text-anchor="middle" fill="#111">정답은 높게</text>
  <text x="865" y="100" text-anchor="middle" fill="#111">오답은 낮게</text>
  <text x="865" y="122" text-anchor="middle" fill="#555" font-size="12">LoRA만 학습</text>

  <text x="20" y="210" font-size="17" font-weight="bold" fill="#111">사용: 두 사람의 사진에서 같은 공간 찾기</text>
  <rect x="20" y="230" width="170" height="90" fill="none" stroke="#111"/>
  <text x="105" y="268" text-anchor="middle" fill="#111">촬영 시각으로</text>
  <text x="105" y="290" text-anchor="middle" fill="#111">후보 좁히기</text>
  <line x1="190" y1="275" x2="245" y2="275" stroke="#111" marker-end="url(#a)"/>
  <rect x="250" y="230" width="190" height="90" fill="none" stroke="#111"/>
  <text x="345" y="262" text-anchor="middle" fill="#111">사람 마스크 만들고</text>
  <text x="345" y="284" text-anchor="middle" fill="#111">같은 환경 점수 계산</text>
  <text x="345" y="306" text-anchor="middle" fill="#555" font-size="12">사진 1장 87ms, 쌍 1.5ms</text>
  <line x1="440" y1="275" x2="495" y2="275" stroke="#111" marker-end="url(#a)"/>
  <rect x="500" y="230" width="190" height="90" fill="none" stroke="#111"/>
  <text x="595" y="262" text-anchor="middle" fill="#111">직접 판정</text>
  <text x="595" y="284" text-anchor="middle" fill="#555" font-size="12">점수 &gt; 기준값이면</text>
  <text x="595" y="302" text-anchor="middle" fill="#555" font-size="12">같은 공간</text>
  <line x1="690" y1="275" x2="745" y2="275" stroke="#111" marker-end="url(#a)"/>
  <rect x="750" y="230" width="190" height="90" fill="none" stroke="#111"/>
  <text x="845" y="262" text-anchor="middle" fill="#111">안 되면 다리 1장</text>
  <text x="845" y="284" text-anchor="middle" fill="#555" font-size="12">같은 시간대 다른 사진과</text>
  <text x="845" y="302" text-anchor="middle" fill="#555" font-size="12">양쪽 모두 이어지면 인정</text>
  <text x="20" y="370" fill="#555" font-size="12">기준값은 ETH3D에서 다른 장소 쌍의 1%만 넘도록 정한 값이에요. 다리 기준값은 직접 기준값보다 0.01 높게 둬요.</text>
</svg>
